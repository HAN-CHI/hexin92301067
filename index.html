<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>禾欣禮儀企業社｜禾欣生命禮儀</title>
<meta name="description" content="禾風送暖，欣慰送行，懷念思恩意永存。24H 生命禮儀服務專線 0800-311-911">
<style>
:root{--bg:#fbf6ea;--bg2:#f3e8d0;--card:#fffdf7;--ink:#24305e;--navy:#1f2f78;--plum:#4f1d4f;--line:#e0d2b4;--muted:#6b6478;--r:18px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a24;--bg2:#252333;--card:#201f2c;--ink:#ece6d6;--navy:#aab6f5;--plum:#d9a9d9;--line:#3a3750;--muted:#a9a3b8}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px;height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;line-height:1.9;font-size:17px}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:auto;display:flex;align-items:center;gap:10px;padding:8px 16px}
.brand{font-weight:700;color:var(--navy);letter-spacing:.12em;flex:1;font-size:18px}
.brand small{display:block;font-size:11px;letter-spacing:.2em;color:var(--plum);font-weight:400;line-height:1.2}
nav{display:none;gap:22px}nav a{font-size:15px;letter-spacing:.12em;padding:4px 2px;border-bottom:2px solid transparent}
nav a.on,nav a:hover{border-color:var(--plum);color:var(--plum)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:10px 20px;font:inherit;font-size:15px;border:1px solid var(--plum);background:transparent;color:var(--plum);cursor:pointer;min-height:44px}
.btn.fill{background:var(--plum);color:#fff}.btn:active{transform:scale(.97)}
#menuBtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer}
#drawer{display:none;flex-direction:column;border-top:1px solid var(--line);background:var(--bg)}#drawer.open{display:flex}
#drawer a{padding:14px 24px;border-bottom:1px solid var(--line);letter-spacing:.2em}
.hotline{background:linear-gradient(135deg,#3f1740,#1f2f78);color:#fff;text-align:center;padding:14px 16px}
.hotline .t{font-size:13px;letter-spacing:.25em;opacity:.85}
.hotline .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.hotline a{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 20px;font-size:20px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.hotline a small{font-size:12px;opacity:.85;margin-right:8px;letter-spacing:.1em}
.hero{max-width:1040px;margin:18px auto 0;padding:0 16px}
.hero img{width:100%;display:block;border-radius:var(--r);border:1px solid var(--line);box-shadow:0 10px 30px rgba(79,29,79,.12)}
.logo{display:flex;align-items:center;gap:14px;margin:14px 0 0}
.logo img{width:84px;height:84px;border-radius:16px;box-shadow:none}
.logo b{font-size:15px;letter-spacing:.1em;color:var(--plum)}
section{max-width:1040px;margin:auto;padding:56px 16px 8px}
.eyebrow{font-size:12px;letter-spacing:.4em;color:var(--plum);text-transform:uppercase}
h2{margin:4px 0 6px;font-size:30px;color:var(--navy);letter-spacing:.14em;font-weight:700}
.rule{width:56px;height:2px;background:var(--plum);margin:10px 0 22px;border-radius:2px}
.slogan{font-size:19px;color:var(--plum);letter-spacing:.1em;margin:0 0 14px}
.about{display:grid;gap:22px}.about p{margin:0 0 12px}
.about img{width:100%;border-radius:var(--r);border:1px solid var(--line);display:block}
.quote{border-left:3px solid var(--plum);padding:6px 16px;background:var(--bg2);border-radius:0 var(--r) var(--r) 0;color:var(--navy);font-size:19px}
.flow{list-style:none;margin:0;padding:0;position:relative}
.flow:before{content:"";position:absolute;left:21px;top:10px;bottom:10px;width:1px;background:var(--line)}
.flow li{position:relative;padding-left:58px;margin-bottom:14px}
.num{position:absolute;left:0;top:10px;width:43px;height:43px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;font-size:15px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.step h3{margin:0;font-size:19px;color:var(--navy);letter-spacing:.14em;display:flex;justify-content:space-between;align-items:center}
.step h3 i{font-style:normal;color:var(--plum);transition:.2s}
.step .d{display:none;margin-top:6px;font-size:15px;color:var(--muted);line-height:1.8;border-top:1px dashed var(--line);padding-top:8px}
.step.open .d{display:block}.step.open h3 i{transform:rotate(45deg)}
.d b{color:var(--plum);font-weight:600}
.entry{display:grid;gap:8px;margin-bottom:18px}
.entry div{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;text-align:center;letter-spacing:.1em;color:var(--navy)}
.cgrid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card .k{font-size:13px;letter-spacing:.3em;color:var(--plum)}
.card .v{font-size:24px;color:var(--navy);margin:2px 0 12px;font-variant-numeric:tabular-nums;word-break:keep-all}
.acts{display:flex;flex-wrap:wrap;gap:8px}
footer{margin-top:56px;background:var(--bg2);border-top:1px solid var(--line);text-align:center;padding:28px 16px calc(28px + 64px);font-size:14px;color:var(--muted)}
footer b{display:block;color:var(--navy);letter-spacing:.2em;font-size:17px;margin-bottom:4px}
.fab{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.fab a{flex:1;text-align:center;padding:12px;border-radius:999px;background:var(--plum);color:#fff;letter-spacing:.12em;font-size:15px}.fab a+a{background:var(--navy);color:#fff}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--plum);color:#fff;padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:40;font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%)}
.fade{opacity:0;transform:translateY(14px);transition:.7s}.fade.in{opacity:1;transform:none}
@media(min-width:760px){nav{display:flex}#menuBtn,#drawer{display:none!important}.fab{display:none}footer{padding-bottom:28px}
.about{grid-template-columns:1.1fr 1fr;align-items:start}.cgrid{grid-template-columns:1fr 1fr}.entry{grid-template-columns:repeat(3,1fr)}.brand{flex:0 0 auto;margin-right:auto}h2{font-size:34px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.fade{transition:none}}
</style>
</head>

<section id="flow" class="fade"><div class="eyebrow">SERVICE FLOW</div><h2>禮儀服務流程</h2><div class="rule"></div>
<div class="entry" id="entry"></div><ol class="flow" id="steps"></ol></section>
<section id="contact" class="fade"><div class="eyebrow">CONTACT</div><h2>聯繫資訊</h2><div class="rule"></div>
<p id="contactTitle" style="margin-top:0"></p><div class="cgrid" id="cards"></div>
<div style="margin-top:22px" class="acts"><button class="btn fill" id="share">分享本網站給親友</button></div></section>
</main>
<footer><b id="fname"></b><span id="fsub"></span></footer>
<div class="fab" id="fab"></div><div id="toast"></div>
<script>
/* ============ 內容區：要修改文字，只需改下面引號 " " 內的內容 ============ */
const SITE = {
  name: "禾欣禮儀企業社",
  brandSub: "生命禮儀",
  slogan: "禾風送暖，欣慰送行，懷念思恩意永存",
  hotline: { label: "24H 專線", number: "0800-311-911" },
  mobile:  { label: "手機",     number: "0910-482-711" },
  address: "台中市西屯區福上巷 199 號",
  contactTitle: "24 小時生命禮儀服務諮詢專線：",
  about: [
    "民國 90 年 5 月 22 日的這天，那年的我 32 歲，在一張泛黃的老照片中，記錄著我與父親十載年來一起工作時的回憶。",
    "回想起當時的台式靈車滿滿的鮮花，也是早期禮儀工作的縮影，與現在的禮儀大不相同，也述說著現代殯葬的多元化。",
    "民國 112 年 2 月 21 日在父親的支持下開創藍圖，正式創立了【禾欣禮儀企業社】，是一種責任-承接傳統的文化，注入現代的精神，延續對生命禮儀的尊重與用心。"
  ],
  aboutQuote: "告別不是結束，而是愛與記憶的延續。",
  entry: ["禮儀諮詢／臨終關懷", "住院臨終／自宅臨終", "意外事故／非自然身亡"],
  steps: [
    ["24H 服務專線", "0800-311-911"],
    ["遺體接運", "<b>住院死亡：</b>醫院開立死亡證明書<br><b>自宅死亡：</b>行政相驗<br><b>意外死亡：</b>司法相驗"],
    ["殯儀館／會館　或　自宅", "<b>殯儀館／會館：</b>協助辦理入館手續<br><b>自宅：</b>需拼廳，協助鋪設水床"],
    ["遺體冰存／打桶入殮", ""],
    ["豎立靈堂", "依家人宗教信仰：佛教、道教、基督教、天主教…等"],
    ["禮儀協調", "<b>禮儀規劃：</b>與家人確認出殯日期、訃聞核對、塔位/墓地擇定、法會、告別式會場選擇"],
    ["會場佈置", ""],
    ["告別式", "<b>奠禮儀式：</b>家祭、公祭、自由捻香<br><b>追思儀式、其他儀式</b>"],
    ["火化　或　土葬", "<b>火化：</b>返主安靈、牌位香火寄放，之後進入環保葬／骨塔<br><b>土葬</b>"],
    ["後續關懷", "百日對年通知、祭品代訂、法事誦經<br><b>禮儀諮詢：</b>擇日合爐、撿骨晉金"]
  ],
  footer: "© 禾欣禮儀企業社　版權所有"
};
/* ============ 以下為程式，不需修改 ============ */
const $=id=>document.getElementById(id),tel=n=>"tel:"+n.replace(/[^\d+]/g,"");
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)};
const copy=async(txt)=>{try{await navigator.clipboard.writeText(txt);toast("已複製："+txt)}catch(e){const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("已複製："+txt)}catch(_){toast("請長按文字手動複製")}a.remove()}};
const links=[["about","關於禾欣"],["flow","服務流程"],["contact","聯繫資訊"]];
$("brand").innerHTML=SITE.name+"<small>"+SITE.brandSub+"</small>";
$("logoTxt").textContent=SITE.slogan;
$("nav").innerHTML=links.map(l=>`<a href="#${l[0]}" data-s="${l[0]}">${l[1]}</a>`).join("");
$("drawer").innerHTML=links.map(l=>`<a href="#${l[0]}">${l[1]}</a>`).join("");
$("hotline").innerHTML=`<div class="t">24 小時生命禮儀服務專線</div><div class="row"><a href="${tel(SITE.hotline.number)}"><small>${SITE.hotline.label}</small>${SITE.hotline.number}</a><a href="${tel(SITE.mobile.number)}"><small>${SITE.mobile.label}</small>${SITE.mobile.number}</a></div>`;
$("aboutTxt").innerHTML=`<p class="slogan">『${SITE.slogan}』</p>`+SITE.about.map(p=>`<p>${p}</p>`).join("")+`<div class="quote">${SITE.aboutQuote}</div>`;
$("entry").innerHTML=SITE.entry.map(e=>`<div>${e}</div>`).join("");
$("steps").innerHTML=SITE.steps.map((s,i)=>`<li><span class="num">${i+1}</span><button class="step" aria-expanded="false"><h3>${s[0]}${s[1]?"<i>＋</i>":""}</h3>${s[1]?`<div class="d">${s[1]}</div>`:""}</button></li>`).join("");
document.querySelectorAll(".step").forEach(b=>b.onclick=()=>{if(!b.querySelector(".d"))return;const o=b.classList.toggle("open");b.setAttribute("aria-expanded",o)});
$("contactTitle").textContent=SITE.contactTitle;
const map="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(SITE.address);
const card=(k,v,acts)=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="acts">${acts}</div></div>`;
$("cards").innerHTML=card(SITE.hotline.label,SITE.hotline.number,`<a class="btn fill" href="${tel(SITE.hotline.number)}">立即撥打</a><button class="btn" data-c="${SITE.hotline.number}">複製號碼</button>`)
+card(SITE.mobile.label,SITE.mobile.number,`<a class="btn fill" href="${tel(SITE.mobile.number)}">立即撥打</a><button class="btn" data-c="${SITE.mobile.number}">複製號碼</button>`)
+`<div class="card" style="grid-column:1/-1"><div class="k">地址</div><div class="v">${SITE.address}</div><div class="acts"><a class="btn fill" href="${map}" target="_blank" rel="noopener">開啟地圖導航</a><button class="btn" data-c="${SITE.address}">複製地址</button></div></div>`;
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>copy(b.dataset.c));
$("fab").innerHTML=`<a href="${tel(SITE.hotline.number)}">☎ 24H 專線</a><a href="${tel(SITE.mobile.number)}">☎ 手機</a>`;
$("fname").textContent=SITE.name;$("fsub").textContent=SITE.footer;
$("share").onclick=async()=>{const u=location.href;if(navigator.share){try{await navigator.share({title:SITE.name,text:SITE.slogan,url:u})}catch(e){}}else copy(u)};
const mb=$("menuBtn"),dr=$("drawer");
mb.onclick=()=>{const o=dr.classList.toggle("open");mb.setAttribute("aria-expanded",o);mb.textContent=o?"✕":"☰"};
dr.onclick=e=>{if(e.target.tagName=="A"){dr.classList.remove("open");mb.textContent="☰"}};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.s==e.target.id))}}),{threshold:.2});
document.querySelectorAll(".fade").forEach(s=>io.observe(s));
</script>
</body>
</html>
